x-qdrant: &qdrant
  image: qdrant/qdrant:v1.17.0
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
    interval: 10m
    start_period: 1m
    start_interval: 1s
    timeout: 5s

services:
  ragglet:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        RAGGLET_COMMIT: ${RAGGLET_COMMIT:-}
    image: ragglet:local
    profiles: [app]
    network_mode: host
    init: true
    stop_grace_period: 20s
    user: "${RAGGLET_UID:-1000}:${RAGGLET_GID:-1000}"
    environment:
      RAGGLET_HOST: 127.0.0.1
      RAGGLET_PORT: ${RAGGLET_PORT:-8000}
      RAGGLET_QDRANT_ENDPOINTS:
      RAGGLET_REDIS_URL:
      OPENAI_API_KEY:
    volumes:
      - ../configs:/app/configs
      - ../datasets:/app/datasets:ro
      - ../results:/app/results
      - ragglet_cache:/home/ragglet/.cache
    depends_on:
      qdrant: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['RAGGLET_PORT'] + '/v1/openapi.json', timeout=5)"]
      interval: 10m
      start_period: 2m
      start_interval: 1s
      timeout: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis_data:/data]
    profiles: [qdrant, qdrant-multi, milvus, weaviate, pgvector, app]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10m
      start_period: 1m
      start_interval: 1s
      timeout: 5s

  qdrant:
    <<: *qdrant
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
    profiles: [qdrant, app]

  qdrant-shard-0:
    <<: *qdrant
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant_shard0_data:/qdrant/storage]
    profiles: [qdrant-multi]

  qdrant-shard-1:
    <<: *qdrant
    ports: ["127.0.0.1:6334:6333"]
    volumes: [qdrant_shard1_data:/qdrant/storage]
    profiles: [qdrant-multi]

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: ragglet-pgvector
    environment:
      POSTGRES_USER: ragglet
      POSTGRES_PASSWORD: ragglet
      POSTGRES_DB: ragglet
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    profiles: [pgvector]

volumes:
  redis_data:
  qdrant_data:
  qdrant_shard0_data:
  qdrant_shard1_data:
  pg_data:
  ragglet_cache:
