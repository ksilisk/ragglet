# S5 — Distributed-like.
# Текущая схема принимает storage.mode=sharded, но runtime пока использует один backend.
# Пока это schema-safe заготовка: fanout sources помечены backend_ref в params.
# После доработки BackendRegistry должен маршрутизировать source.params.backend_ref на shard collections.

version: 1
name: "s5_distributed_like"
description: "S5: distributed-like fanout retrieval over shard-like vector sources."
tags: ["s5", "distributed-like", "sharded", "fanout"]
seed: 42

run:
  repeats: 5
  shuffle: true
  save_per_query: true
  artifacts_dir: "results/runs"

output:
  format: "both"
  include_debug_fields: true

dataset:
  id: "data/queries/baseline_qdrant.jsonl"
  limit: 2000
  query_field: "question"
  truth_field: "relevant"

storage:
  mode: "sharded"
  backend:
    type: "qdrant"
    endpoint: "http://localhost:6333"
    collection: "chunks_v1"

embedding:
  model: "all-MiniLM-L6-v2"
  normalize: true

retrieval:
  strategy: "fanout_merge"
  top_k: 30
  async: true
  sources:
    - name: "shard_0_vector"
      kind: "vector"
      weight: 1.0
      params:
        backend_ref: "shard_0"      # TODO(runtime): map to chunks_v1_shard0 or endpoint/collection registry.
        ef_search: 64
    - name: "shard_1_vector"
      kind: "vector"
      weight: 1.0
      params:
        backend_ref: "shard_1"      # TODO(runtime): map to chunks_v1_shard1 or endpoint/collection registry.
        ef_search: 64
  merge:
    method: "rrf"
    rrf_k: 60
    deduplicate: true

rerank:
  enabled: false
  model: null
  input_top_k: 30
  output_top_n: 10

context:
  enabled: false
  max_tokens: 1200
  policy: "top_n"
  threshold: 0.0
  include_metadata: true

generation:
  enabled: false
  provider: "openai_compatible"
  model: null
  temperature: 0.2
  max_output_tokens: 300

cache:
  enabled: false

metrics:
  latency_steps: ["embed", "retrieve", "total"]  # Add "merge" after runtime emits lat_merge_ms.
  percentiles: [50, 95, 99]
  quality:
    recall_at_k: [1, 3, 5, 10, 30]
    mrr_at_k: 30

timeouts:
  total_ms: 6000
  retrieval_ms: 1800
  rerank_ms: 800
  llm_ms: 3500
