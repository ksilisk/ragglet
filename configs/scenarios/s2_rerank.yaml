# S2 — Rerank.
# Pipeline: retrieve top_k -> rerank input_top_k -> evaluate output_top_n.

version: 1
name: "s2_rerank"
description: "S2: vector retrieval plus rerank stage."
tags: ["s2", "rerank"]
seed: 42

run:
  repeats: 5
  shuffle: true
  save_per_query: true
  artifacts_dir: "results/runs"

output:
  format: "both"
  include_debug_fields: true

dataset:
  source: "local"
  id: "datasets/demo"
  split: "test"
  limit: 2000

storage:
  mode: "single"
  backend:
    type: "qdrant"
    endpoint: "http://localhost:6333"
    collection: "chunks_v1"

embedding:
  model: "all-MiniLM-L6-v2"
  normalize: true

retrieval:
  strategy: "single"
  top_k: 50
  async: false
  sources:
    - name: "qdrant_vector"
      kind: "vector"
      weight: 1.0
      params:
        ef_search: 128
  merge:
    method: "rrf"
    rrf_k: 60
    deduplicate: true

rerank:
  enabled: true
  provider: "cross_encoder"
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  input_top_k: 50
  output_top_n: 10

context:
  enabled: false
  max_tokens: 1200
  policy: "top_n"
  threshold: 0.0
  include_metadata: true

generation:
  enabled: false
  provider: "noop"
  model: null
  temperature: 0.2
  max_output_tokens: 300

cache:
  enabled: false

metrics:
  latency_steps: ["embed", "retrieve", "rerank", "total"]
  percentiles: [50, 95, 99]
  quality:
    recall_at_k: [1, 3, 5, 10, 30]
    mrr_at_k: 30

timeouts:
  total_ms: 7000
  retrieval_ms: 1500
  rerank_ms: 1200
  llm_ms: 3500
