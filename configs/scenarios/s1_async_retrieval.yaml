# S1 — Async Retrieval.
# Текущий runtime умеет async fanout внутри одного query.
# Чего не хватает: query-level concurrency и throughput/QPS summary.

version: 1
name: "s1_async_retrieval"
description: "S1: async fanout retrieval over multiple vector source configurations."
tags: ["s1", "async", "fanout"]
seed: 42

run:
  repeats: 5
  shuffle: true
  save_per_query: true
  artifacts_dir: "results/runs"

output:
  format: "both"
  include_debug_fields: true

dataset:
  id: "data/queries/baseline_qdrant.jsonl"
  limit: 2000
  query_field: "question"
  truth_field: "relevant"

storage:
  mode: "single"
  backend:
    type: "qdrant"
    endpoint: "http://localhost:6333"
    collection: "chunks_v1"

embedding:
  model: "all-MiniLM-L6-v2"
  normalize: true

retrieval:
  strategy: "fanout_merge"
  top_k: 30
  async: true
  sources:
    - name: "qdrant_fast"
      kind: "vector"
      weight: 1.0
      params:
        ef_search: 32
    - name: "qdrant_recall"
      kind: "vector"
      weight: 1.0
      params:
        ef_search: 128
  merge:
    method: "rrf"
    rrf_k: 60
    deduplicate: true

rerank:
  enabled: false
  model: null
  input_top_k: 30
  output_top_n: 10

context:
  enabled: false
  max_tokens: 1200
  policy: "top_n"
  threshold: 0.0
  include_metadata: true

generation:
  enabled: false
  provider: "noop"
  model: null
  temperature: 0.2
  max_output_tokens: 300

cache:
  enabled: false

metrics:
  latency_steps: ["embed", "retrieve", "total"]
  percentiles: [50, 95, 99]
  quality:
    recall_at_k: [1, 3, 5, 10, 30]
    mrr_at_k: 30

timeouts:
  total_ms: 6000
  retrieval_ms: 1500
  rerank_ms: 800
  llm_ms: 3500
