# Холодная и тёплая фаза — два прогона подряд с одним namespace: первый наполняет кэш
# эмбеддингов, второй стартует с тёплого. Для каждого trial нужен новый namespace.
# Кэш retrieval в памяти живёт один повтор, поэтому холодный в обоих прогонах.
version: 1
name: "article_b1_cache_phases"
description: "Article matrix B paired cold/warm cache phases using isolated Redis DB 15."
tags: ["article", "cache", "b1", "cold-warm", "redis-db-15"]
seed: 42

run:
  repeats: 1
  shuffle: false
  save_per_query: true
  artifacts_dir: "results/article/raw"

output:
  format: "both"
  include_debug_fields: true

dataset:
  source: "local"
  id: "datasets/demo"
  split: "test"
  limit: 100

storage:
  mode: "single"
  backend:
    type: "qdrant"
    endpoint: "http://localhost:6333"
    collection: "chunks_v1"

embedding:
  model: "all-MiniLM-L6-v2"
  normalize: true

retrieval:
  strategy: "single"
  top_k: 30
  async: false
  sources:
    - name: "qdrant_vector"
      kind: "vector"
      weight: 1.0
      params:
        ef_search: 64
  merge:
    method: "rrf"
    rrf_k: 60
    deduplicate: true

rerank:
  enabled: false
  model: null
  input_top_k: 30
  output_top_n: 10

context:
  enabled: false
  max_tokens: 1200
  policy: "top_n"
  threshold: 0.0
  include_metadata: true

generation:
  enabled: false
  provider: "noop"
  model: null
  temperature: 0.2
  max_output_tokens: 300

cache:
  enabled: true
  embedding:
    type: "redis"
    endpoint: "redis://localhost:6379/15"
    ttl_seconds: 86400
    namespace: "b1_trial1"
  retrieval:
    type: "memory_lru"
    size: 10000

metrics:
  latency_steps: ["embed", "retrieve", "total"]
  percentiles: [50, 95]
  quality:
    k: [1, 3, 5, 10, 30]
    doc: ["recall", "hit", "mrr"]

timeouts:
  total_ms: 6000
  retrieval_ms: 1500
  rerank_ms: 800
  llm_ms: 3500
