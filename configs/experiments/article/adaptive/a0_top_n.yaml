version: 1
name: "article_a0_top_n"
description: "Article matrix A static top_n context control."
tags: ["article", "adaptive", "a0", "top-n"]
seed: 42

run:
  repeats: 5
  shuffle: false
  save_per_query: true

output:
  format: "both"
  include_debug_fields: true

dataset:
  source: "local"
  id: "datasets/demo"
  split: "test"
  limit: 100

storage:
  mode: "single"
  backend:
    type: "qdrant"
    endpoint: "http://localhost:6333"
    collection: "chunks_v1"

embedding:
  model: "all-MiniLM-L6-v2"
  normalize: true

retrieval:
  strategy: "single"
  top_k: 30
  async: false
  sources:
    - name: "qdrant_vector"
      kind: "vector"
      weight: 1.0
      params:
        ef_search: 64
  merge:
    method: "rrf"
    rrf_k: 60
    deduplicate: true

rerank:
  enabled: false
  model: null
  input_top_k: 30
  output_top_n: 10

context:
  enabled: true
  max_tokens: 1200
  policy: "top_n"
  threshold: 0.0
  include_metadata: true

generation:
  enabled: false
  provider: "noop"
  model: null
  temperature: 0.2
  max_output_tokens: 300

cache:
  enabled: false

metrics:
  latency_steps: ["embed", "retrieve", "context", "total"]
  percentiles: [50, 95]
  quality:
    k: [1, 3, 5, 10, 30]
    doc: ["recall", "hit", "mrr"]
    chunk: ["mrr", "precision"]

timeouts:
  total_ms: 6000
  retrieval_ms: 1500
  rerank_ms: 800
  llm_ms: 3500
