# Ragglet configuration reference.
# This file is documentation, not an executable config.
# It describes schema-level options, current runtime support, and known conflicts.

version: 1
generated_for_project_state: "May 2026"

status_legend:
  implemented: "Validated by schema and used by runtime."
  partial: "Validated and partly used, but behavior is incomplete or has caveats."
  reserved: "Accepted by schema or documented for future work, but not executed."
  schema_only: "Accepted by schema, but currently ignored by runtime."
  broken_or_mismatch: "Known to produce wrong results, crash, or conflict with current files."
  documentation_only: "Documented here for operators; not parsed by Ragglet code."

source_files:
  index_profile_schema: "src/ragglet/config/index_profile.py"
  scenario_schema: "src/ragglet/config/scenario.py"
  index_runtime: "src/ragglet/indexing/build_index.py"
  bench_runtime: "src/ragglet/bench/run_scenario.py"
  retrieval_runtime: "src/ragglet/retrieval/engine.py"
  merge_runtime: "src/ragglet/retrieval/merge.py"
  cache_runtime: "src/ragglet/cache/manager.py"
  docker_compose: "docker/docker-compose.yaml"

config_files:
  index_profiles:
    pattern: "configs/indexes/*.yaml"
    current_examples:
      - "configs/indexes/demo.yaml"
    cli: "ragglet index build <profile.yaml>"
    schema_model: "IndexProfileConfig"
  scenarios:
    pattern: "configs/scenarios/*.yaml"
    current_examples:
      - "configs/scenarios/baseline_qdrant.yaml"
      - "configs/scenarios/baseline_qdrant_fanout_two_vec.yaml"
    cli: "ragglet bench run <scenario.yaml>"
    validation_cli: "ragglet bench validate <scenario.yaml>  # the bench run preflight without running queries"
    schema_model: "ScenarioConfig"
  docker:
    path: "docker/docker-compose.yaml"
    cli: "docker compose -f docker/docker-compose.yaml --profile qdrant up -d qdrant redis"

index_profile:
  purpose: "Build or rebuild an offline retrieval index from a BEIR dataset."
  root:
    id:
      type: "string"
      required: true
      default: null
      status: implemented
      docs: "Human-readable profile identifier. Currently used for config identity only, not for artifact paths."
    dataset:
      type: "object"
      required: true
      status: implemented
      docs: "BEIR dataset to index (its corpus.jsonl). Same (source, id) convention as scenario.dataset."
      fields:
        source:
          type: "enum"
          required: false
          default: "local"
          allowed_values:
            - "local"
            - "hf"
          docs: "local = path to a BEIR directory; hf = HuggingFace Hub dataset repo id (snapshot downloaded to cache). Values come from the dataset source registry (datasets/sources.py)."
        id:
          type: "string"
          required: true
          docs: "For local: path to the BEIR dataset directory. For hf: repo id, e.g. 'BeIR/scifact'."
        revision:
          type: "string|null"
          default: null
          status: implemented
          docs: "Source-defined pin. hf: commit of the dataset repo; BeIR/* keep qrels in '<id>-qrels', so the pin is '<data_sha>+<qrels_sha>'. local: not supported (validation error) - a local dataset is versioned by its content hash."
          runtime_behavior: "The resolved revision is always recorded (run manifest.json); copy it here to pin. The hf cache directory is keyed by the revision."
      runtime_behavior: "The whole dataset (corpus, queries, every qrels split) is validated before embedding; any error aborts the build with file:line diagnostics. corpus.jsonl is read; each document is chunked (or kept whole with chunking.method=none); payload stores doc_id (ground truth), chunk_id, chunk_index, title, text. Collection metadata (corpus_sha256, embedding revision, chunking, storage layout) is written after the last upsert; a collection without it is treated as an unfinished build."
    chunking:
      type: "object"
      required: false
      status: implemented
      fields:
        method:
          type: "enum"
          default: "recursive"
          allowed_values:
            - "recursive"
            - "none"
          status: implemented
          docs: "recursive = character-based chunking (despite the name, it does not split by semantic structure). none = each document is indexed whole as one point (chunk_id '<doc_id>#0'), the standard BEIR setup; document- and chunk-level metrics coincide."
          caveat: "The embedder silently truncates input to the model max_seq_length (all-MiniLM-L6-v2: 256 tokens), so with method=none the tail of long documents does not reach the vector. Use recursive chunking for long documents."
        chunk_size:
          type: "integer|null"
          default: "800 for recursive"
          constraints:
            schema_enforced: "> 0; not allowed with method=none"
          status: implemented
          docs: "Maximum chunk length in characters."
        chunk_overlap:
          type: "integer|null"
          default: "120 for recursive"
          constraints:
            schema_enforced: "0 <= chunk_overlap < chunk_size; not allowed with method=none"
          status: implemented
          docs: "Overlap between adjacent chunks in characters."
          runtime_behavior: "Runtime step is chunk_size - chunk_overlap; invalid overlap values are rejected by schema."
    embedding:
      type: "object"
      required: true
      status: implemented
      fields:
        model:
          type: "string"
          default: null
          status: implemented
          docs: "SentenceTransformers model name passed to SentenceTransformer."
          runtime_behavior: "Used for index embeddings and vector size probing."
        revision:
          type: "string|null"
          default: null
          status: implemented
          docs: "Commit of the model repo on HuggingFace Hub (short names resolve to sentence-transformers/<name>). Null = current main."
          runtime_behavior: "The resolved commit is written to collection metadata; bench run loads exactly this revision for query embeddings, so scenario has no revision field."
        normalize:
          type: "boolean"
          default: true
          status: implemented
          docs: "Passed as normalize_embeddings to SentenceTransformer.encode."
        batch_size:
          type: "integer"
          default: 64
          status: partial
          docs: "Flush size for upsert batches."
          runtime_behavior: "Index build flushes when batch_ids >= batch_size. The embedder itself clamps encode batch_size to min(64, len(texts))."
    storage:
      type: "object"
      required: true
      status: partial
      fields:
        type:
          type: "enum"
          default: "qdrant"
          allowed_values:
            - "qdrant"
            - "pgvector"
            - "milvus"
            - "weaviate"
          status: partial
          docs: "Backend type."
          runtime_behavior: "Only qdrant is implemented. Other values validate but raise NotImplementedError during index build."
        endpoint:
          type: "string"
          default: null
          status: implemented
          docs: "Backend endpoint URL."
        collection:
          type: "string"
          default: null
          status: implemented
          docs: "Collection/index name in the backend."
        mode:
          type: "enum"
          default: "single"
          allowed_values:
            - "single"
            - "sharded"
            - "replicated"
          status: partial
          docs: "Optional distributed-like index layout. Single preserves the historical endpoint/collection behavior."
          runtime_behavior: "For qdrant, sharded writes each chunk to one backend using hash_mod routing; replicated writes each chunk to all configured backends."
        backends:
          type: "list[object]"
          default: []
          status: partial
          docs: "Named storage targets used when mode is sharded or replicated."
        routing:
          type: "object"
          status: partial
          docs: "Routing key for distributed-like index build."
          fields:
            key:
              type: "enum"
              default: "chunk_id"
              allowed_values:
                - "chunk_id"
                - "doc_id"
              status: implemented
              docs: "For mode=sharded, write target is selected as sha1(payload[key]) % backend_count. If key is missing, chunk_id is used. For mode=replicated, every chunk is written to every backend. Route by doc_id to keep all chunks of a document on one shard."
    index_params:
      type: "object"
      required: false
      status: partial
      fields:
        distance:
          type: "enum"
          default: "cosine"
          allowed_values:
            - "cosine"
            - "dot"
            - "euclid"
          status: implemented
          docs: "Qdrant vector distance."
        hnsw:
          type: "object"
          status: implemented
          fields:
            m:
              type: "integer"
              default: 16
              status: implemented
              docs: "Qdrant HNSW m parameter."
            ef_construct:
              type: "integer"
              default: 128
              status: implemented
              docs: "Qdrant HNSW ef_construct parameter."

scenario:
  purpose: "Run retrieval benchmarks over a JSONL query dataset."
  root:
    version:
      type: "integer"
      default: 1
      status: implemented
      docs: "Scenario schema version. No migration logic exists yet."
    name:
      type: "string"
      required: true
      status: implemented
      docs: "Scenario name. Used in results/runs/<name>_<timestamp>/ and cache key signatures."
    description:
      type: "string|null"
      default: null
      status: documentation_only
      docs: "Human-readable description. Not used by runtime."
    tags:
      type: "list[string]"
      default: []
      status: documentation_only
      docs: "Human-readable tags. Not used by runtime."
    seed:
      type: "integer"
      default: 42
      status: implemented
      docs: "Base seed for deterministic per-repeat shuffling."
    timeouts:
      type: "object"
      status: implemented
      fields:
        total_ms:
          type: "integer"
          default: 6000
          status: implemented
          docs: "Per-query end-to-end budget, from the planned start of the query to the answer. For run.load.type=closed the planned start is when a worker takes the query."
          caveat: "A local model call (embedding, BM25, rerank) is not interrupted midway; the timeout fires right after it returns, so lat_total_ms of a timed-out query can exceed the budget by one such call."
        retrieval_ms:
          type: "integer"
          default: 1500
          status: implemented
          docs: "Timeout around retrieval stage."
          caveat: "Qdrant requests are cancelled at the deadline. Local BM25 runs in a worker thread, one search at a time; the timeout fires after the current search returns."
        rerank_ms:
          type: "integer"
          default: 800
          status: implemented
          docs: "Timeout around rerank stage when scenario.rerank.enabled=true."
          caveat: "The cross-encoder call is not abandoned: the timeout fires right after it returns, and nothing keeps running in the background."
        llm_ms:
          type: "integer"
          default: 3500
          status: implemented
          docs: "Timeout around generation when scenario.generation.enabled=true."
    run:
      type: "object"
      status: implemented
      fields:
        repeats:
          type: "integer"
          default: 1
          constraints:
            schema_enforced: ">= 1"
          status: implemented
          docs: "Number of full dataset passes."
        shuffle:
          type: "boolean"
          default: true
          status: implemented
          docs: "Shuffle query order for each repeat using seed-derived repeat seeds."
        save_per_query:
          type: "boolean"
          default: true
          status: implemented
          docs: "Whether to save per-query files for each repeat."
        artifacts_dir:
          type: "string path"
          default: "results/runs"
          status: implemented
          docs: "Base directory for run folders. Runtime writes to <artifacts_dir>/<scenario.name>_<utc_timestamp>/"
        load:
          type: "object"
          default: {type: "closed", concurrency: 1}
          status: implemented
          docs: "Load model: decides only when each query of a repeat is launched. `type` selects a model from LOAD_MODELS in src/ragglet/bench/load.py; the other fields are its params, validated by that model and saved to the snapshot with defaults. Whatever the model, the runtime core runs every query exactly once, writes per-query rows in repeat order, and stops the run on the first unexpected error."
          fields:
            type:
              type: "enum"
              default: "closed"
              allowed_values:
                - "closed"
              status: implemented
              docs: "closed = N users; each sends the next query only after getting the answer to the previous one. A new model is a class with Params and drive(n, launch) plus one LOAD_MODELS entry."
            concurrency:
              type: "integer"
              default: 1
              constraints:
                schema_enforced: ">= 1"
              status: implemented
              docs: "closed: how many queries are in flight at once, end to end from embedding to the LLM answer. Network stages (Redis, Qdrant, generation) run concurrently. Local CPU models (embedding, BM25, rerank) take one call at a time in a worker thread; waiting for them is part of lat_embed_ms, lat_retrieve_ms and lat_rerank_ms."
              caveat: "Per-query emb_hit_rate/ret_hit_rate are cumulative, so with concurrency > 1 they depend on completion order; summary averages them."
    output:
      type: "object"
      status: partial
      fields:
        format:
          type: "enum"
          default: "parquet"
          allowed_values:
            - "parquet"
            - "csv"
            - "both"
          status: implemented
          docs: "Controls per-query output format only."
          caveat: "summary.csv/json and summary.aggregate.csv/json are always written."
        include_debug_fields:
          type: "boolean"
          default: false
          status: schema_only
          docs: "Accepted but currently ignored."
    dataset:
      type: "object"
      status: implemented
      docs: "BEIR dataset for queries + qrels (document-level ground truth)."
      fields:
        source:
          type: "enum"
          default: "local"
          allowed_values:
            - "local"
            - "hf"
          status: implemented
          docs: "local = path to a BEIR directory; hf = HuggingFace Hub dataset repo id."
        id:
          type: "string"
          required: true
          status: implemented
          docs: "For local: path to BEIR dataset directory. For hf: repo id, e.g. 'BeIR/scifact'."
        revision:
          type: "string|null"
          default: null
          status: implemented
          docs: "Source-defined pin. hf: commit of the dataset repo; BeIR/* keep qrels in '<id>-qrels', so the pin is '<data_sha>+<qrels_sha>'. local: not supported (validation error) - a local dataset is versioned by its content hash."
          runtime_behavior: "The resolved revision is always recorded (run manifest.json); copy it here to pin. The hf cache directory is keyed by the revision."
        split:
          type: "string"
          default: "test"
          status: implemented
          docs: "Which qrels/<split>.tsv to evaluate against."
        limit:
          type: "integer"
          default: 2000
          constraints:
            schema_enforced: ">= 1"
          status: implemented
          docs: "Maximum number of queries to load (after joining with qrels)."
      runtime_behavior: "bench run validates the corpus and the selected split before the run (no run directory on failure) and checks that the index was built from the same corpus (corpus_sha256). manifest.json records revision, corpus_sha256 and eval_sha256 (queries + qrels after split and limit); quality metrics of two runs are comparable when both hashes match."
    storage:
      type: "object"
      status: partial
      fields:
        mode:
          type: "enum"
          default: "single"
          allowed_values:
            - "single"
            - "sharded"
            - "replicated"
          status: partial
          docs: "Controls distributed-like retrieval layout. Single uses backend; sharded/replicated use named backends."
          runtime_behavior: "Qdrant sharded retrieval uses source.params.backend_ref to route vector sources to configured backends; validate checks all configured backends."
        backend:
          type: "object"
          status: partial
          fields:
            type:
              type: "enum"
              allowed_values:
                - "qdrant"
                - "pgvector"
                - "milvus"
                - "weaviate"
              status: partial
              docs: "Retrieval backend type."
              runtime_behavior: "Only qdrant is implemented. Other values validate but raise NotImplementedError."
            endpoint:
              type: "string"
              status: implemented
              docs: "Backend endpoint URL."
            collection:
              type: "string"
              status: implemented
              docs: "Backend collection name."
        backends:
          type: "list[object]"
          default: []
          status: partial
          docs: "Named qdrant backends. Required when mode is sharded or replicated."
        routing:
          type: "object"
          status: partial
          docs: "Routing key metadata shared with index profiles. This does not create retrieval fanout."
          fields:
            key:
              type: "enum"
              default: "chunk_id"
              allowed_values:
                - "chunk_id"
                - "doc_id"
              status: implemented
              docs: "Documents the sharding key expected by the matching index profile. Retrieval fanout must be configured explicitly through retrieval.sources[].params.backend_ref."
    embedding:
      type: "object"
      status: implemented
      fields:
        model:
          type: "string"
          default: "all-MiniLM-L6-v2"
          status: implemented
          docs: "SentenceTransformers model for query embeddings."
          conflict: "Must match the model used to build the index. For Qdrant, bench run validates this against collection metadata and loads the model revision recorded there."
        normalize:
          type: "boolean"
          default: true
          status: implemented
          docs: "Passed to SentenceTransformer.encode for query embeddings."
          conflict: "Must match index_profile.embedding.normalize. For Qdrant, bench run validates this against collection metadata."
    retrieval:
      type: "object"
      status: partial
      fields:
        strategy:
          type: "enum"
          default: "single"
          allowed_values:
            - "single"
            - "fanout_merge"
            - "cascade"
          status: partial
          docs: "Retrieval strategy."
          runtime_behavior:
            single: "Implemented for vector source only. Keyword single retrieval is rejected by schema as not implemented yet."
            fanout_merge: "Implemented for vector and keyword sources."
            cascade: "Accepted by schema but not implemented at runtime."
        top_k:
          type: "integer"
          default: 30
          constraints:
            schema_enforced: ">= 1"
          status: implemented
          docs: "Number of retrieved ids returned after source query or merge."
        async:
          type: "boolean"
          default: true
          status: partial
          docs: "Controls parallel vs sequential source execution for fanout_merge."
          caveat: "Has no meaningful effect for single. Keyword BM25 is synchronous even in async fanout."
        sources:
          type: "list[object]"
          default: []
          status: partial
          docs: "Source list. Required by schema when strategy is not single."
          item_fields:
            name:
              type: "string"
              required: true
              status: implemented
              docs: "Source name used in merge maps and cache signatures."
            kind:
              type: "enum"
              default: "vector"
              allowed_values:
                - "vector"
                - "keyword"
              status: partial
              docs: "Source kind."
              runtime_behavior:
                vector: "Uses AsyncQdrantStore.search."
                keyword: "Uses in-memory BM25 built by exporting Qdrant payloads."
              conflict: "keyword with strategy=single is rejected by schema; keyword is currently supported only in fanout_merge."
            weight:
              type: "float"
              default: 1.0
              status: implemented
              docs: "Source weight used by rrf and weighted_sum. Interleave currently ignores weights unless called with weighted=true, which config cannot set."
            params:
              type: "map"
              default: {}
              status: partial
              docs: "Source-specific parameters."
              known_params:
                vector:
                  ef_search:
                    type: "integer"
                    status: implemented
                    docs: "Mapped to Qdrant SearchParams.hnsw_ef."
                keyword:
                  k1:
                    type: "float"
                    default: 1.2
                    status: implemented
                    docs: "BM25 k1 parameter used when building the in-memory index."
                  b:
                    type: "float"
                    default: 0.75
                    status: implemented
                    docs: "BM25 b parameter used when building the in-memory index."
        merge:
          type: "object"
          status: partial
          fields:
            method:
              type: "enum"
              default: "rrf"
              allowed_values:
                - "rrf"
                - "weighted_sum"
                - "interleave"
              status: implemented
              docs: "Merge method for fanout_merge."
              runtime_behavior:
                rrf: "Implemented with rrf_k and weights."
                weighted_sum: "Implemented with hardcoded minmax normalization per source."
                interleave: "Implemented as simple round-robin; configured weights are ignored."
            rrf_k:
              type: "integer"
              default: 60
              status: implemented
              docs: "RRF rank constant. Only used when method=rrf."
            deduplicate:
              type: "boolean"
              default: true
              status: partial
              docs: "Deduplicate by chunk_id where applicable."
              caveat: "weighted_sum already aggregates by chunk_id; deduplicate flag has no practical effect there."
    rerank:
      type: "object"
      status: implemented
      fields:
        enabled:
          type: "boolean"
          default: false
          status: implemented
          docs: "When true, runs rerank after retrieval and evaluates metrics over reranked ids."
        provider:
          type: "enum"
          default: "cross_encoder"
          allowed_values:
            - "cross_encoder"
            - "noop"
          status: implemented
          docs: "Reranker implementation. cross_encoder uses sentence-transformers CrossEncoder; noop preserves retrieval order."
        model:
          type: "string|null"
          default: null
          status: implemented
          docs: "Required when rerank.enabled=true and provider=cross_encoder."
        revision:
          type: "string|null"
          default: null
          status: implemented
          docs: "Commit of the rerank model repo on HuggingFace Hub (the name is used as is, CrossEncoder does not add an organization). Null = current main."
          runtime_behavior: "The resolved commit is recorded in run manifest.json (rerank.revision); copy it here to pin."
        input_top_k:
          type: "integer"
          default: 30
          status: implemented
          docs: "Number of retrieved candidates passed into rerank."
        output_top_n:
          type: "integer"
          default: 10
          status: implemented
          docs: "Number of reranked candidates kept for final metrics."
    context:
      type: "object"
      status: implemented
      fields:
        enabled:
          type: "boolean"
          default: false
          status: implemented
          docs: "When true, assembles context after retrieval/rerank and evaluates metrics over context ids."
        max_tokens:
          type: "integer"
          default: 1200
          status: implemented
          docs: "Approximate token budget for selected context chunks. Current token count uses whitespace estimation."
        policy:
          type: "enum"
          default: "top_n"
          allowed_values:
            - "top_n"
            - "adaptive"
            - "threshold"
          status: implemented
          docs: "Context selection policy. top_n fills budget in rank order; threshold filters by score; adaptive filters by normalized score then fills budget."
        threshold:
          type: "float"
          default: 0.0
          status: implemented
          docs: "Minimum raw score for threshold policy or normalized score for adaptive policy."
        include_metadata:
          type: "boolean"
          default: true
          status: implemented
          docs: "When true, context_text includes chunk_id labels before chunk text."
    generation:
      type: "object"
      status: implemented
      fields:
        enabled:
          type: "boolean"
          default: false
          status: implemented
          docs: "When true, runs generation after context assembly. Requires context.enabled=true."
        provider:
          type: "enum"
          default: "noop"
          allowed_values:
            - "noop"
            - "openai_compatible"
          status: implemented
          docs: "Generation provider. openai_compatible sends question/context to an external chat-completions-compatible endpoint."
        base_url:
          type: "string"
          default: "https://api.openai.com/v1"
          status: implemented
          docs: "Base URL for openai_compatible provider."
        api_key_env:
          type: "string"
          default: "OPENAI_API_KEY"
          status: implemented
          docs: "Environment variable containing the API key for openai_compatible provider."
        model:
          type: "string|null"
          default: null
          status: implemented
          docs: "Required by schema when generation.enabled=true."
        temperature:
          type: "float"
          default: 0.2
          status: implemented
          docs: "Provider sampling temperature."
        max_output_tokens:
          type: "integer"
          default: 300
          status: implemented
          docs: "Maximum generated output tokens; used to bound latency and cost."
        save:
          type: "object"
          status: implemented
          fields:
            prompt:
              type: "boolean"
              default: false
              status: implemented
              docs: "When true, saves prompt_text in per-query artifacts."
            answer:
              type: "boolean"
              default: true
              status: implemented
              docs: "When true, saves generated answer in per-query artifacts."
            raw_response:
              type: "boolean"
              default: false
              status: implemented
              docs: "When true, saves raw provider response in per-query artifacts."
    cache:
      type: "object"
      status: partial
      fields:
        enabled:
          type: "boolean"
          default: false
          status: implemented
          docs: "Master switch for cache layer construction. When true, at least one layer must be configured: embedding or retrieval."
        embedding:
          type: "object|null"
          default: null
          status: partial
          docs: "Redis embedding cache. Optional when cache.enabled=true if another cache layer is configured."
          fields:
            type:
              type: "enum"
              default: "redis"
              allowed_values:
                - "redis"
              status: implemented
            endpoint:
              type: "string"
              status: implemented
              docs: "Redis URL."
            ttl_seconds:
              type: "integer"
              default: 86400
              status: implemented
              docs: "Redis TTL for embedding vectors."
        retrieval:
          type: "object|null"
          default: null
          status: implemented
          docs: "In-process LRU cache for retrieved id lists."
          caveat: "Not persisted across CLI processes. It can hit across repeats inside the same scenario run."
          fields:
            type:
              type: "enum"
              default: "memory_lru"
              allowed_values:
                - "memory_lru"
              status: implemented
            size:
              type: "integer"
              default: 10000
              status: implemented
              docs: "Maximum number of retrieval entries."
    metrics:
      type: "object"
      status: implemented
      fields:
        latency_steps:
          type: "list[string]"
          default:
            - "embed"
            - "retrieve"
            - "total"
          status: implemented
          docs: "Latency steps to summarize. Runtime currently emits lat_embed_ms, lat_retrieve_ms, lat_rerank_ms, lat_context_ms, lat_generation_ms, and lat_total_ms; merge is reserved until a separate merge timer exists. total covers every query including timeouts and errors; a step covers only the queries where it completed, its cell is empty otherwise. See docs/metrics.md."
          caveat: "A step disabled in the scenario (for example rerank with rerank.enabled=false) has no values and gives null percentiles."
        percentiles:
          type: "list[integer]"
          default:
            - 50
            - 95
            - 99
          constraints:
            schema_enforced: "non-empty list, each value between 0 and 100"
          status: implemented
          docs: "Percentiles computed for each configured latency step with an existing lat_<step>_ms column. Output keys use lat_<step>_p<percentile>, for example lat_total_p99."
        quality:
          type: "object"
          status: implemented
          docs: "Quality of the final list (after rerank/context) against document-level qrels. Every metric of a level is computed for every k; columns are <level>_<metric>@<k>, summary adds <column>_mean."
          fields:
            k:
              type: "list[integer]"
              default:
                - 1
                - 3
                - 5
                - 10
              constraints:
                schema_enforced: "non-empty, unique, >= 1, max(k) <= final list depth (retrieval.top_k, or min with rerank.input_top_k/output_top_n when rerank is enabled)"
              status: implemented
              docs: "Cutoffs shared by all @k metrics."
            doc:
              type: "list[enum]"
              default:
                - "ndcg"
                - "recall"
                - "hit"
                - "mrr"
              allowed_values:
                - "ndcg"
                - "recall"
                - "r_cap"
                - "hit"
                - "mrr"
                - "precision"
              status: implemented
              docs: "Document-level metrics, comparable with BEIR: retrieved chunks are projected to unique doc_id keeping the best rank. ndcg@k = order quality that takes qrels grades into account (linear gain, as in BEIR/MTEB); recall@k = share of relevant documents found in top k; r_cap@k = relevant in top k divided by min(k, number of relevant); hit@k = at least one relevant document in top k; mrr@k = 1/rank of the first relevant document; precision@k = relevant documents in top k divided by k. A document is relevant when its qrels score is > 0. Semantics and examples: docs/metrics.md."
              caveat: "If the final list has fewer than k unique documents, @k is computed over the shorter list; summary reports doc_short@<k>_rate. Raise retrieval.top_k when it is high."
            chunk:
              type: "list[enum]"
              default: []
              allowed_values:
                - "hit"
                - "mrr"
                - "precision"
              status: implemented
              docs: "Chunk-level metrics over unique chunks of the final list (what goes into the context); a chunk inherits the relevance of its document. Off by default; enable it (for example [mrr, precision]) when the scenario varies chunking or context. With chunking.method=none it equals the document level."
              caveat: "Inherited relevance is a proxy: a chunk of a relevant document counts even if it does not contain the answer. recall, r_cap and ndcg are not available at this level: the number of relevant chunks is unknown with document-level qrels."

runtime_support_matrix:
  storage_backends:
    qdrant:
      index_build: implemented
      bench_retrieval: implemented
    pgvector:
      index_build: reserved
      bench_retrieval: reserved
      note: "Schema accepts it, runtime raises NotImplementedError."
    milvus:
      index_build: reserved
      bench_retrieval: reserved
      note: "Schema accepts it, runtime raises NotImplementedError."
    weaviate:
      index_build: reserved
      bench_retrieval: reserved
      note: "Schema accepts it, runtime raises NotImplementedError."
  retrieval_strategies:
    single:
      vector: implemented
      keyword: reserved
      note: "Keyword single retrieval is rejected by schema as not implemented yet."
    fanout_merge:
      vector_vector: implemented
      vector_keyword: implemented
      keyword_only: partial
      note: "Keyword backend is built from Qdrant payload export, so Qdrant is still required."
    cascade:
      status: reserved
      note: "Accepted by schema, not implemented."
  merge_methods:
    rrf:
      status: implemented
      uses_weights: true
      configurable_params:
        - "rrf_k"
        - "deduplicate"
    weighted_sum:
      status: partial
      uses_weights: true
      normalization: "hardcoded minmax"
      note: "No scenario field exists to choose normalization."
    interleave:
      status: partial
      uses_weights: false
      note: "Code supports a weighted argument internally, but scenario config cannot enable it."
  stages:
    retrieval: implemented
    rerank: implemented
    context_assembly: implemented
    generation: implemented
    serve_api: reserved

known_conflicts_and_gotchas:
  - id: "non_qdrant_backends_validate_but_fail"
    severity: medium
    applies_to:
      - "index_profile.storage.type"
      - "scenario.storage.backend.type"
    condition: "type is pgvector, milvus, or weaviate"
    effect: "Config validation passes, runtime raises NotImplementedError."
    recommended_rule: "Mark as reserved in user docs or reject until implemented."
  - id: "storage_routing_is_write_layout_only"
    severity: medium
    applies_to:
      - "scenario.storage.mode"
      - "scenario.storage.routing"
      - "index_profile.storage.routing"
    condition: "mode is sharded or replicated"
    effect: "storage.mode controls index write layout. For sharded indexes, writes use sha1(routing.key) modulo backend count. Retrieval routing is not inferred from storage.routing; vector sources must name params.backend_ref explicitly."
    recommended_rule: "Use qdrant-multi compose profile, a matching sharded/replicated index profile, and explicit retrieval.sources with backend_ref values before running distributed-like scenarios."
  - id: "generation_requires_context"
    severity: medium
    applies_to:
      - "scenario.generation.enabled"
    condition: "enabled=true and scenario.context.enabled=false"
    effect: "Config validation fails because generation consumes explicit assembled context."
    recommended_rule: "Set context.enabled=true before enabling generation."
  - id: "docker_app_profile_references_missing_dockerfile"
    severity: medium
    applies_to:
      - "docker/docker-compose.yaml"
    condition: "docker compose --profile app build/run"
    effect: "docker/Dockerfile is referenced but not present."
    recommended_rule: "Add Dockerfile or remove/mark app profile as reserved."

